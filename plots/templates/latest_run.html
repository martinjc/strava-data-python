<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Latest Run</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .title {
            position: absolute;
            top: 40px;
            left: 30px;
        }

        .content-container {
            display: flex;
            position: absolute;
            top: 80px;
            left: 30px;
            width: 540px;
            /* 600 - 30 - 30 */
            height: 338px;
            /* 448 - 80 - 30 */
        }

        .map-container {
            flex: 1;
            /* border: 1px solid #eee; */
        }

        .stats-container {
            flex: 0 0 200px;
            /* Fixed width for stats */
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .route-path {
            fill: none;
            stroke: #fc4c02;
            /* Strava Orange */
            stroke-width: 3px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .stat-item {
            margin-bottom: 20px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .run-description {
            font-size: 14px;
            color: #555;
            font-style: italic;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div id="chart">
        <div class="title" id="run-title">Latest Run</div>
        <div class="content-container">
            <div class="map-container" id="map"></div>
            <div class="stats-container" id="stats">
            </div>
        </div>
    </div>
    <script>
        // Polyline Decoder function
        // Source: https://github.com/mapbox/polyline/blob/master/src/polyline.js
        function decode(str, precision) {
            var index = 0,
                lat = 0,
                lng = 0,
                coordinates = [],
                shift = 0,
                result = 0,
                byte = null,
                latitude_change,
                longitude_change,
                factor = Math.pow(10, precision || 5);

            while (index < str.length) {
                byte = null;
                shift = 0;
                result = 0;

                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);

                latitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));

                shift = result = 0;

                do {
                    byte = str.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);

                longitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));

                lat += latitude_change;
                lng += longitude_change;

                coordinates.push([lat / factor, lng / factor]);
            }

            return coordinates;
        }

        // To GeoJSON LineString (note: GeoJSON is [lng, lat], polyline is [lat, lng])
        function toGeoJSON(str) {
            const coords = decode(str);
            return {
                type: "LineString",
                coordinates: coords.map(c => [c[1], c[0]])
            };
        }

        d3.json("/data/activities.json").then(data => {

            // Find latest run
            const runs = data.filter(d => d.type === "Run");
            // Sort Descending
            runs.sort((a, b) => new Date(b.start_date) - new Date(a.start_date));

            const latestRun = runs[0];
            if (!latestRun) {
                d3.select("#run-title").text("No runs found");
                return;
            }

            // Populate Text
            d3.select("#run-title").text(latestRun.name);

            // Stats
            const statsDiv = d3.select("#stats");

            // Date
            const dateObj = new Date(latestRun.start_date);
            const dateStr = dateObj.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

            statsDiv.append("div").attr("class", "stat-item")
                .html(`<div class="stat-label">Date</div><div class="stat-value" style="font-size: 16px;">${dateStr} ${timeStr}</div>`);

            // Distance
            const distKm = (latestRun.distance / 1000).toFixed(2);
            statsDiv.append("div").attr("class", "stat-item")
                .html(`<div class="stat-label">Distance</div><div class="stat-value">${distKm} <span style="font-size:14px; font-weight:normal;">km</span></div>`);

            // Pace
            const timeMin = latestRun.moving_time / 60.0;
            const paceDec = timeMin / (latestRun.distance / 1000);
            const m = Math.floor(paceDec);
            const s = Math.round((paceDec - m) * 60);
            const paceStr = `${m}:${s < 10 ? "0" + s : s}`;
            statsDiv.append("div").attr("class", "stat-item")
                .html(`<div class="stat-label">Avg Pace</div><div class="stat-value">${paceStr} <span style="font-size:14px; font-weight:normal;">/km</span></div>`);

            // Time
            const h = Math.floor(timeMin / 60);
            const mm = Math.floor(timeMin % 60);
            const ss = Math.round((timeMin * 60) % 60);
            const durStr = h > 0 ? `${h}h ${mm}m` : `${mm}m ${ss}s`;
            statsDiv.append("div").attr("class", "stat-item")
                .html(`<div class="stat-label">Time</div><div class="stat-value">${durStr}</div>`);

            // Description (if exists)
            // Note: Strava API might not return 'description' unless detailed view, or if missing.
            // Check if user has description/comment
            // API field often used is 'description' or 'name' (already used). 
            // In list view, sometimes description is not present. We'll check.
            if (latestRun.description) {
                statsDiv.append("div").attr("class", "run-description")
                    .text(latestRun.description);
            }

            // Map
            const mapContainer = d3.select("#map");
            const width = mapContainer.node().getBoundingClientRect().width;
            const height = mapContainer.node().getBoundingClientRect().height;

            const svg = mapContainer.append("svg")
                .attr("width", width)
                .attr("height", height);

            if (latestRun.map && latestRun.map.summary_polyline) {
                const geojson = toGeoJSON(latestRun.map.summary_polyline);

                // Projection
                const projection = d3.geoIdentity().reflectY(true);
                const path = d3.geoPath(projection);

                // Fit features
                projection.fitExtent([[10, 10], [width - 10, height - 10]], geojson);

                svg.append("path")
                    .datum(geojson)
                    .attr("class", "route-path")
                    .attr("d", path);
            } else {
                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", height / 2)
                    .attr("text-anchor", "middle")
                    .text("No map data");
            }

        }).catch(err => {
            console.error(err);
        });
    </script>
</body>

</html>
