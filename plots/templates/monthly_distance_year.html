<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Monthly Distance - Year</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .axis line,
        .axis path {
            stroke: #000;
        }

        /* .bar fill set dynamically in JS */
    </style>
</head>

<body>
    <div id="chart"></div>
    <script>
        // Get Year from URL
        // Get Year from URL
        const params = new URLSearchParams(window.location.search);
        const targetYear = parseInt(params.get("year"));
        const themeColor = params.get("color") || "#4c78a8";

        const width = 600;
        const height = 448;
        const margin = { top: 60, right: 30, bottom: 40, left: 50 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("background", "white");

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Title
        svg.append("text")
            .attr("class", "title")
            .attr("x", margin.left)
        svg.append("text")
            .attr("class", "title")
            .attr("x", margin.left)
            .attr("y", 40)
            .attr("fill", themeColor)
            .text(targetYear ? `Distance per month - ${targetYear}` : "Distance per month");

        // Y Axis Label
        svg.append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", 15)
            .attr("x", -(height / 2))
            .style("text-anchor", "middle")
            .style("font-size", "10px")
            .text("Distance (km)");

        if (!targetYear) {
            svg.append("text").attr("x", 100).attr("y", 100).text("No year specified (?year=YYYY)");
        } else {
            d3.json("/data/activities.json").then(data => {
                const parseDate = d3.utcParse("%Y-%m-%dT%H:%M:%SZ");

                // Initialize all 12 months for the target year to Ensure x-axis is complete
                const months = d3.range(0, 12).map(m => new Date(Date.UTC(targetYear, m, 1)));
                const monthlyData = new Map();
                months.forEach(m => monthlyData.set(m.toISOString(), 0));

                data.forEach(d => {
                    if (d.type === "Run") {
                        const date = parseDate(d.start_date);
                        if (!date) return;

                        if (date.getUTCFullYear() === targetYear) {
                            const monthKey = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1)).toISOString();
                            monthlyData.set(monthKey, (monthlyData.get(monthKey) || 0) + d.distance);
                        }
                    }
                });

                const processedData = months.map(m => {
                    return {
                        date: m,
                        distance: (monthlyData.get(m.toISOString()) || 0) / 1000.0
                    };
                });

                // Scales
                const x = d3.scaleBand()
                    .domain(processedData.map(d => d.date))
                    .range([0, innerWidth])
                    .padding(0.05);

                const y = d3.scaleLinear()
                    .domain([0, d3.max(processedData, d => d.distance)]).nice()
                    .range([innerHeight, 0]);

                // Bars
                g.selectAll(".bar")
                    .data(processedData)
                    .join("rect")
                    .attr("class", "bar")
                    .attr("fill", themeColor)
                    .attr("x", d => x(d.date))
                    .attr("y", d => y(d.distance))
                    .attr("width", x.bandwidth())
                    .attr("height", d => innerHeight - y(d.distance));

                // Axes
                // X Axis: All months
                const xAxis = d3.axisBottom(x)
                    .tickFormat(d3.timeFormat("%b"));

                g.append("g")
                    .attr("class", "x-axis")
                    .attr("transform", `translate(0,${innerHeight})`)
                    .call(xAxis);

                // Y Axis
                g.append("g")
                    .attr("class", "y-axis")
                    .call(d3.axisLeft(y).ticks(5));

            }).catch(err => {
                console.error(err);
            });
        }
    </script>
</body>

</html>
