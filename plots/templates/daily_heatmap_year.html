<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Daily Distance Heatmap - Year</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .cell {
            stroke: #fff;
            stroke-width: 1px;
        }

        .axis line,
        .axis path {
            display: none;
        }
    </style>
</head>

<body>
    <div id="chart"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const targetYear = parseInt(params.get("year"));
        const themeColor = params.get("color") || "#4c78a8";

        const width = 600;
        const height = 448;
        // Standard margins matching other plots
        const margin = { top: 60, right: 30, bottom: 40, left: 50 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("background", "white");

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Title
        // Title
        svg.append("text")
            .attr("class", "title")
            .attr("x", margin.left)
            .attr("y", 40) // Standard title position
            .attr("fill", themeColor)
            .text(targetYear ? `Daily distance - ${targetYear}` : "Daily distance");

        if (targetYear) {
            d3.json("/data/activities.json").then(data => {
                const parseDate = d3.utcParse("%Y-%m-%dT%H:%M:%SZ");

                // Map: YYYY-MM-DD -> Distance
                const dailyData = new Map();
                let maxDistance = 0;

                data.forEach(d => {
                    if (d.type === "Run") {
                        const date = parseDate(d.start_date);
                        if (!date || date.getUTCFullYear() !== targetYear) return;

                        const dayStr = d3.timeFormat("%Y-%m-%d")(date);
                        const distKm = d.distance / 1000.0;
                        const val = (dailyData.get(dayStr) || 0) + distKm;
                        dailyData.set(dayStr, val);
                        if (val > maxDistance) maxDistance = val;
                    }
                });

                // Generate grid for the year
                const yearStart = new Date(Date.UTC(targetYear, 0, 1));
                const yearEnd = new Date(Date.UTC(targetYear, 11, 31));
                const daysInYear = d3.timeDay.range(yearStart, d3.timeDay.offset(yearEnd, 1));

                // Layout Config: 2 Rows (Jan-Jun, Jul-Dec)
                const rows = 2;
                const weeksPerRow = 27; // 53 weeks / 2 ~= 26.5

                // Add padding inside the chart area to separate from title
                const topPadding = 20;
                const availableHeight = innerHeight - topPadding;

                // Calculate Cell Size
                const cellW = Math.floor(innerWidth / weeksPerRow);
                const cellH = Math.floor(availableHeight / (rows * 10)); // 7 days + 3 for gap
                const cellSize = Math.min(cellW, cellH) - 1;

                const rowGap = cellSize * 3; // Gap between half-years

                // Color
                const color = d3.scaleSequential(d3.interpolateRgb("white", themeColor))
                    .domain([0, maxDistance || 10]);

                const gridData = daysInYear.map(d => {
                    const val = dailyData.get(d3.timeFormat("%Y-%m-%d")(d)) || 0;
                    const weekNumRaw = +d3.utcFormat("%U")(d);
                    const dayNum = d.getUTCDay(); // 0-6 Sun-Sat

                    // Determine visual row (0 or 1)
                    const rowIdx = Math.floor(weekNumRaw / weeksPerRow);
                    const colIdx = weekNumRaw % weeksPerRow;

                    return {
                        date: d,
                        val: val,
                        row: rowIdx,
                        col: colIdx,
                        day: dayNum
                    };
                });

                g.selectAll(".cell")
                    .data(gridData)
                    .join("rect")
                    .attr("class", "cell")
                    .attr("x", d => d.col * (cellSize + 1))
                    // Apply topPadding to Y coordinate
                    .attr("y", d => topPadding + (d.row * (7 * (cellSize + 1) + rowGap)) + (d.day * (cellSize + 1)))
                    .attr("width", cellSize)
                    .attr("height", cellSize)
                    .attr("fill", d => d.val === 0 ? "#f0f0f0" : color(d.val));

                // Labels
                // Day Labels (Sun, Tue, Thu, Sat) - Render for each row
                const dayLabels = ["Sun", "", "Tue", "", "Thu", "", "Sat"];
                for (let r = 0; r < rows; r++) {
                    const yOffset = topPadding + r * (7 * (cellSize + 1) + rowGap);
                    g.selectAll(`.day-label-${r}`)
                        .data(dayLabels)
                        .enter().append("text")
                        .attr("class", "day-label")
                        .attr("x", -5)
                        .attr("y", (d, i) => yOffset + i * (cellSize + 1) + cellSize / 1.5)
                        .style("text-anchor", "end")
                        .style("font-size", "12px")
                        .text(d => d);
                }

                // Month Labels
                const months = d3.timeMonth.range(yearStart, yearEnd);
                g.selectAll(".month-label")
                    .data(months)
                    .enter().append("text")
                    .attr("class", "month-label")
                    .attr("x", d => {
                        const weekNum = +d3.utcFormat("%U")(d);
                        const rowIdx = Math.floor(weekNum / weeksPerRow);
                        const colIdx = weekNum % weeksPerRow;
                        // Correct x position for the specific row
                        return colIdx * (cellSize + 1);
                    })
                    .attr("y", d => {
                        const weekNum = +d3.utcFormat("%U")(d);
                        const rowIdx = Math.floor(weekNum / weeksPerRow);
                        // Place ABOVE the block, including topPadding
                        const yOffset = topPadding + rowIdx * (7 * (cellSize + 1) + rowGap);
                        return yOffset - 5;
                    })
                    .style("font-size", "12px")
                    .style("font-weight", "bold")
                    .text(d3.timeFormat("%b"));

            }).catch(err => {
                console.error(err);
            });
        }
    </script>
</body>

</html>
