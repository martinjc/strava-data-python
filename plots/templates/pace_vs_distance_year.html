<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pace vs Distance - Year</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .dot {
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div id="chart"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const targetYear = parseInt(params.get("year"));
        const themeColor = params.get("color") || "#4c78a8";

        const width = 600;
        const height = 448;
        const margin = { top: 60, right: 30, bottom: 60, left: 70 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("background", "white");

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Title
        svg.append("text")
            .attr("class", "title")
            .attr("x", margin.left)
            .attr("y", 40)
            .attr("fill", themeColor)
            .text(targetYear ? `Pace vs Distance - ${targetYear}` : "Pace vs Distance");

        if (targetYear) {
            d3.json("/data/activities.json").then(data => {

                const runs = [];
                const parseDate = d3.utcParse("%Y-%m-%dT%H:%M:%SZ");

                data.forEach(d => {
                    if (d.type === "Run" && d.distance > 0 && d.moving_time > 0) {
                        const date = parseDate(d.start_date);
                        if (!date || date.getUTCFullYear() !== targetYear) return;

                        const distKm = d.distance / 1000.0;
                        const timeMin = d.moving_time / 60.0;
                        const pace = timeMin / distKm;

                        if (pace > 0 && pace < 30) {
                            runs.push({
                                distance: distKm,
                                pace: pace
                            });
                        }
                    }
                });

                // Scales
                const x = d3.scaleLinear()
                    .domain([0, d3.max(runs, d => d.distance) || 10]).nice()
                    .range([0, innerWidth]);

                const minPace = d3.min(runs, d => d.pace) || 4;
                const maxPace = d3.max(runs, d => d.pace) || 6;

                const y = d3.scaleLinear()
                    .domain([minPace * 0.9, maxPace * 1.1]).nice()
                    .range([0, innerHeight]); // Reversed via 0 at top logic logic (Small value = Top)

                // Axes
                g.append("g")
                    .attr("class", "x-axis")
                    .attr("transform", `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(x));

                g.append("g")
                    .attr("class", "y-axis")
                    .call(d3.axisLeft(y)
                        .tickFormat(d => {
                            const m = Math.floor(d);
                            const s = Math.round((d - m) * 60);
                            return `${m}:${s < 10 ? "0" + s : s}`;
                        })
                    );

                // Dots
                g.selectAll(".dot")
                    .data(runs)
                    .enter().append("circle")
                    .attr("class", "dot")
                    .attr("fill", themeColor)
                    .attr("cx", d => x(d.distance))
                    .attr("cy", d => y(d.pace))
                    .attr("r", 3);

            }).catch(err => {
                console.error(err);
            });
        }
    </script>
</body>

</html>
